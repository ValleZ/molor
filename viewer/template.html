<style>
/* Layout: instrument console - plot pane left, inspector rail right, sticky control bar. */
:root {
  --bg: #eef1f3;
  --surface: #ffffff;
  --surface-2: #f6f8f9;
  --line: #d6dee4;
  --fg: #141f28;
  --muted: #5c6b77;
  --accent: #0a6f7d;
  --accent-soft: #d2ebee;
  --warn: #b4532a;
  --font-display: "Bricolage Grotesque", Georgia, serif;
  --font-body: "Archivo", system-ui, -apple-system, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d141a;
    --surface: #151f27;
    --surface-2: #1b262f;
    --line: #27343f;
    --fg: #e5edf3;
    --muted: #91a1ae;
    --accent: #45c6d6;
    --accent-soft: #11313a;
    --warn: #e08b5f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d141a;
  --surface: #151f27;
  --surface-2: #1b262f;
  --line: #27343f;
  --fg: #e5edf3;
  --muted: #91a1ae;
  --accent: #45c6d6;
  --accent-soft: #11313a;
  --warn: #e08b5f;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.45;
  margin: 0;
}
.wrap {
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px 28px;
  max-width: 1680px;
  margin: 0 auto;
}
h1 {
  font-family: var(--font-display);
  font-size: clamp(22px, 3vw, 31px);
  font-weight: 700;
  letter-spacing: -0.02em;
  margin: 0 0 4px;
  text-wrap: balance;
}
.sub { color: var(--muted); margin: 0 0 16px; max-width: 70ch; }
.sub code { font-family: var(--font-mono); font-size: 0.88em; }

.bar {
  display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 10px; padding: 10px 12px; margin-bottom: 12px;
}
/* The hidden attribute is a UA-stylesheet rule, so any author rule that
   sets display beats it -- .field below did, which left the layout
   picker on screen and empty whenever the payload carried one encoder. */
[hidden] { display: none !important; }
.field { display: flex; align-items: center; gap: 6px; min-width: 0; }
label.lab {
  font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--muted); font-weight: 600;
}
select, input[type="search"] {
  font-family: var(--font-body); font-size: 13px; color: var(--fg);
  background: var(--surface-2); border: 1px solid var(--line);
  border-radius: 7px; padding: 6px 9px; min-width: 0;
}
input[type="search"] { width: 100%; min-width: 200px; }
.field.grow { flex: 1 1 260px; min-width: 0; }
.toggle {
  display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
  font-size: 13px; color: var(--fg); user-select: none;
}
.btn {
  font-family: var(--font-body); font-size: 12.5px; font-weight: 500;
  background: var(--surface-2); color: var(--fg);
  border: 1px solid var(--line); border-radius: 7px;
  padding: 6px 11px; cursor: pointer;
}
.btn:hover { border-color: var(--accent); }
.btn.on { background: var(--accent-soft); border-color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.main { display: grid; grid-template-columns: minmax(0,1fr) 352px; gap: 12px; align-items: start; }
@media (max-width: 980px) { .main { grid-template-columns: minmax(0,1fr); } }

/* Phones. The plot gets shorter so the inspector is reachable without a long
   scroll, the search field is allowed to shrink below its 200px minimum
   (which overflowed a 320px screen), and anything tappable grows to about
   44px so it can be hit with a thumb. */
@media (max-width: 640px) {
  .wrap { padding-block: 12px 20px; }
  .sub { margin-bottom: 12px; font-size: 14px; }
  .bar { gap: 8px; padding: 9px 10px; }
  input[type="search"] { min-width: 0; }
  .field.grow { flex: 1 1 100%; }
  #plot { height: clamp(300px, 52vh, 560px); }
  .btn { padding: 9px 12px; font-size: 13px; }
  select { padding: 9px 10px; font-size: 14px; }
  input[type="search"] { padding: 9px 10px; font-size: 14px; }
  .toggle { font-size: 14px; padding: 4px 0; }
  .panel { padding: 12px; }
  /* A hover tooltip has no meaning on a touch screen: tapping selects, and
     the inspector below is the readout. */
  #tip { display: none !important; }
}

.plotcard {
  position: relative; background: var(--surface);
  border: 1px solid var(--line); border-radius: 10px; overflow: hidden;
  min-width: 0;
}
#plot { display: block; width: 100%; height: clamp(400px, 70vh, 880px); cursor: grab; touch-action: none; }
#plot.drag { cursor: grabbing; }
.readout {
  position: absolute; left: 12px; bottom: 10px;
  font-family: var(--font-mono); font-size: 11px; color: var(--muted);
  background: color-mix(in srgb, var(--surface) 86%, transparent);
  border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px;
  pointer-events: none;
}
#tip {
  position: absolute; pointer-events: none; z-index: 5;
  background: var(--surface); border: 1px solid var(--accent);
  border-radius: 7px; padding: 6px 9px; font-size: 12.5px;
  box-shadow: 0 6px 20px rgba(0,0,0,.18); max-width: 260px;
}
#tip .t-name { font-weight: 600; }
#tip .t-meta { color: var(--muted); font-family: var(--font-mono); font-size: 11px; }

.rail { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.panel {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 10px; padding: 12px 13px; min-width: 0;
}
.panel h2 {
  font-family: var(--font-display); font-size: 14px; font-weight: 700;
  margin: 0 0 9px; letter-spacing: -0.01em;
}
.chip {
  display: inline-block; font-size: 11px; font-weight: 600;
  padding: 2px 8px; border-radius: 999px; color: #fff;
  letter-spacing: .01em;
}
.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; font-size: 12.5px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-family: var(--font-mono); font-size: 11.5px; word-break: break-all; }
.bars { display: flex; flex-direction: column; gap: 3px; }
.rrow { display: grid; grid-template-columns: 66px 1fr 46px; gap: 7px; align-items: center; font-size: 11.5px; }
.rrow .g { font-family: var(--font-mono); }
.track { display: block; background: var(--surface-2); border-radius: 3px; height: 11px; overflow: hidden; }
/* display:block matters: a bare <span> is inline, and inline boxes ignore
   width and height, which rendered every bar empty. */
.fill { display: block; height: 100%; min-width: 2px; background: var(--accent); border-radius: 3px; }
.rrow .v { font-family: var(--font-mono); text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
.nn { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.nn li { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: baseline; }
.nn button {
  background: none; border: none; padding: 2px 0; text-align: left; cursor: pointer;
  color: var(--fg); font-family: var(--font-body); font-size: 12.5px;
  text-decoration: underline; text-decoration-color: var(--line); min-width: 0;
}
.nn button:hover { color: var(--accent); }
.nn .d { font-family: var(--font-mono); font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.legend { display: flex; flex-wrap: wrap; gap: 5px; }
.legend-actions { display: flex; gap: 6px; margin: 0 0 8px; }
.btn.mini { font-size: 11.5px; padding: 3px 9px; }
select { font: inherit; color: var(--fg); background: var(--surface);
  border: 1px solid var(--line); border-radius: 7px; padding: 6px 8px; }
.lg {
  display: inline-flex; align-items: center; gap: 5px; cursor: pointer;
  border: 1px solid var(--line); border-radius: 999px;
  padding: 2px 8px 2px 5px; font-size: 11.5px; background: var(--surface-2);
  user-select: none;
}
.lg.off { opacity: .35; }
.lg i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.note { color: var(--muted); font-size: 12px; margin: 8px 0 0; }
.warnbox {
  border-left: 3px solid var(--warn); padding-left: 9px;
  color: var(--muted); font-size: 12px; margin-top: 9px;
}
.empty { color: var(--muted); font-size: 12.5px; }
footer { color: var(--muted); font-size: 12px; margin-top: 18px; max-width: 78ch; }
footer strong { color: var(--fg); font-weight: 600; }
</style>

<div class="wrap">
  <h1>Aromachemical Receptor Atlas</h1>
  <p class="sub" id="sub"></p>

  <div class="bar">
    <div class="field grow">
      <label class="lab" for="q">Find</label>
      <input type="search" id="q"
             placeholder="name, formula, odour descriptor, SMILES…" autocomplete="off">
    </div>
    <div class="field" id="modelField" hidden>
      <label class="lab" for="model">Layout</label>
      <select id="model"></select>
    </div>
    <button class="btn" id="clearPin" type="button" hidden>Clear comparison</button>
  </div>

  <div class="main">
    <div class="plotcard">
      <canvas id="plot"></canvas>
      <div class="readout" id="readout"></div>
      <div id="tip" hidden></div>
    </div>

    <div class="rail">
      <div class="panel" id="detail">
        <h2>Inspector</h2>
        <p class="empty">Click a point to inspect it. Shift-click a second point to compare two materials.</p>
      </div>
      <div class="panel">
        <h2 id="legendTitle">Odour family</h2>
        <div class="legend-actions">
          <button class="btn mini" id="selAll" type="button">Select all</button>
          <button class="btn mini" id="selNone" type="button">Deselect all</button>
        </div>
        <div class="legend" id="legend"></div>
        <p class="note">Click a class to show or hide it.</p>
      </div>
    </div>
  </div>

  <footer id="foot"></footer>
</div>

<script id="odata" type="application/json">__ORVECTOR_DATA__</script>
<script>
window.addEventListener("error", function (ev) {
  var el = document.getElementById("detail");
  if (!el) return;
  el.innerHTML = '<h2>Something went wrong</h2><p class="empty">'
    + String(ev.message) + "<br><br>" + String((ev.filename || "") + ":" + (ev.lineno || ""))
    + "</p>";
});
(function () {
  "use strict";
  var D = JSON.parse(document.getElementById("odata").textContent);
  var N = D.molecules.length;

  function M() { return D.models[state.model]; }

  var hasOdour = Array.isArray(D.odours) && D.odours.length > 0;
  var hasPercept = Array.isArray(D.percepts) && D.percepts.length > 0;
  var defaultScheme = hasPercept ? "percept" : hasOdour ? "odour" : "cls";

  function groupsOf(i) {
    // Chemical class gives one group; odour schemes can give several.
    if (state.scheme === "cls") return [D.molecules[i].cls];
    var t = (state.scheme === "percept" ? D.molecules[i].percept : D.molecules[i].odour) || [];
    return t.length ? t : ["unclassified"];
  }
  function groupList() {
    if (state.scheme === "cls") return D.classes;
    var base = state.scheme === "percept" ? D.percepts : D.odours;
    return base.concat(["unclassified"]);
  }
  function groupColour(g) {
    if (state.scheme === "cls") return D.classColour[g];
    var map = state.scheme === "percept" ? D.perceptColour : D.odourColour;
    return (map && map[g]) || "#9aa6b1";
  }
  function primary(i) { return groupsOf(i)[0]; }

  // Flattened upper-triangle distances per encoder, for percentile lookups.
  var flatCache = {};
  function flatFor(key) {
    if (!flatCache[key]) {
      var dd = D.models[key].dist, f = [];
      for (var a = 0; a < N; a++) for (var b = a + 1; b < N; b++) f.push(dd[a][b]);
      f.sort(function (p, q) { return p - q; });
      flatCache[key] = f;
    }
    return flatCache[key];
  }
  function pct(d) {
    var flat = flatFor(state.model);
    var lo = 0, hi = flat.length;
    while (lo < hi) { var m = (lo + hi) >> 1; if (flat[m] < d) lo = m + 1; else hi = m; }
    return (100 * lo / flat.length);
  }

  // Prefer the 3D projection; it preserves local neighbourhoods far better
  // (top-10 overlap 0.70 vs 0.51), which is what stops unrelated materials
  // from looking like cluster members.
  var proj3d = Object.keys(D.models[D.modelOrder[0]].projections)
    .filter(function (k) { return k.indexOf("3") >= 0 && k.indexOf("quality") < 0; });
  var state = {
    scheme: defaultScheme,
    model: D.modelOrder[0],
    proj: proj3d.length ? proj3d[0] : Object.keys(D.models[D.modelOrder[0]].projections)[0],
    sel: null, pin: null, hover: null,
    hidden: Object.create(null), links: true, labels: true, sizeByPotency: false,
    k: 1, tx: 0, ty: 0, fitted: false, query: "", yaw: 0.6, pitch: 0.35
  };

  document.getElementById("selAll").addEventListener("click", function () {
    state.hidden = Object.create(null);
    buildLegend(); draw();
  });
  document.getElementById("selNone").addEventListener("click", function () {
    state.hidden = Object.create(null);
    groupList().forEach(function (g) { state.hidden[g] = true; });
    buildLegend(); draw();
  });

  var cv = document.getElementById("plot");
  var ctx = cv.getContext("2d");
  var tip = document.getElementById("tip");
  var readout = document.getElementById("readout");

  // ---- controls ----
  // One view only: the 3D MDS of the MPNN encoder, coloured by predicted
  // odour. The other projections and encoders stayed in the payload but the
  // controls for them are gone, so the page has nothing to configure.
  var clearPin = document.getElementById("clearPin");
  clearPin.addEventListener("click", function () {
    state.pin = null; clearPin.hidden = true; renderDetail(); draw();
  });
  document.getElementById("q").addEventListener("input", function (e) {
    state.query = e.target.value.trim().toLowerCase(); renderDetail(); draw();
  });

  // ---- legend ----
  var legend = document.getElementById("legend");
  function buildLegend() {
  legend.innerHTML = "";
  document.getElementById("legendTitle").textContent =
    state.scheme === "cls" ? "Chemical class"
      : state.scheme === "percept" ? "Predicted odour" : "Odour family (your notes)";
  groupList().forEach(function (c) {
    var el = document.createElement("span");
    // Reflect current state: buildLegend() runs after Select/Deselect all, and
    // a fresh chip would otherwise always look enabled.
    el.className = "lg" + (state.hidden[c] ? " off" : "");
    el.innerHTML = '<i style="background:' + groupColour(c) + '"></i>' + c.replace(/_/g, " ").toLowerCase();
    el.setAttribute("role", "button");
    el.tabIndex = 0;
    function toggle() {
      state.hidden[c] = !state.hidden[c];
      el.classList.toggle("off", !!state.hidden[c]);
      draw();
    }
    el.addEventListener("click", toggle);
    el.addEventListener("keydown", function (ev) {
      if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); toggle(); }
    });
    legend.appendChild(el);
  });
  }
  buildLegend();


  function visible(i) {
    // An injected blend is always visible. It is not a library material and
    // carries no class or odour family, so every filter would hide it -- and
    // the whole reason it is on the page is to see where it sits.
    if (D.molecules[i].isQuery) return true;
    var g = groupsOf(i);
    for (var k = 0; k < g.length; k++) if (!state.hidden[g[k]]) return true;
    return false;
  }
  function matches(i) {
    if (!state.query) return false;
    var m = D.molecules[i];
    var hay = m.name + " " + m.cls + " " + m.formula + " "
      + (m.odour || []).join(" ") + " " + (m.percept || []).join(" ") + " " + (m.note || "");
    return hay.toLowerCase().indexOf(state.query) >= 0;
  }

  // ---- geometry ----
  var W = 0, H = 0, dpr = 1;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    var r = cv.getBoundingClientRect();
    W = Math.max(240, r.width); H = Math.max(240, r.height);
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function P() { return M().projections[state.proj]; }
  function is3D() { return Array.isArray(P().z); }

  //  Orthographic orbit. 128 points, so a painter's algorithm is plenty and
  //  keeps the page free of any 3D library.
  var _rot = {x: [], y: [], d: []};
  function rotateAll() {
    var p = P(), n = p.x.length;
    var cy = Math.cos(state.yaw), sy = Math.sin(state.yaw);
    var cp = Math.cos(state.pitch), sp = Math.sin(state.pitch);
    _rot.x.length = _rot.y.length = _rot.d.length = n;
    for (var i = 0; i < n; i++) {
      var X = p.x[i], Y = p.y[i], Z = p.z ? p.z[i] : 0;
      var x1 = cy * X + sy * Z;
      var z1 = -sy * X + cy * Z;
      var y2 = cp * Y - sp * z1;
      var z2 = sp * Y + cp * z1;
      _rot.x[i] = x1; _rot.y[i] = y2; _rot.d[i] = z2;
    }
  }
  // The MDS axes come out in an arbitrary orientation, and the cloud usually
  // has one dominant direction. At a fixed starting angle that direction can
  // land vertically, which leaves the view a thin column in a wide window and
  // makes the first thing anyone sees the worst view of the data. So pick the
  // opening angle from the data: search orientations and keep the one that
  // lets the points fill the canvas, which is the one maximising the fit
  // scale. A little pitch is held back from the optimum so the plot still
  // reads as three-dimensional rather than as a flat sheet seen face-on.
  function chooseView() {
    if (!is3D() || !W || !H) return;
    var p = P(), X = p.x, Y = p.y, Z = p.z, n = X.length, pad = 54;
    // The coordinates arrive axis-aligned, widest spread along x, so the
    // search only needs to trim for the window's aspect. It is deliberately
    // held near zero yaw: a wider search finds angles that fill more canvas by
    // turning the long axis into depth, which foreshortens the very gradient
    // the plot exists to show. Filling the frame is not worth hiding that.
    var best = -1, bestYaw = 0, bestPitch = 0.22;
    for (var a = -4; a <= 4; a++) {
      var yaw = a * 0.14, cy = Math.cos(yaw), sy2 = Math.sin(yaw);
      for (var b = -3; b <= 3; b++) {
        var pitch = b * 0.14, cp = Math.cos(pitch), sp = Math.sin(pitch);
        var x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
        for (var i = 0; i < n; i++) {
          var rx = cy * X[i] + sy2 * Z[i];
          var rz = -sy2 * X[i] + cy * Z[i];
          var ry = cp * Y[i] - sp * rz;
          if (rx < x0) x0 = rx;
          if (rx > x1) x1 = rx;
          if (ry < y0) y0 = ry;
          if (ry > y1) y1 = ry;
        }
        var k = Math.min((W - 2 * pad) / Math.max(1e-6, x1 - x0),
                         (H - 2 * pad) / Math.max(1e-6, y1 - y0));
        if (k > best) { best = k; bestYaw = yaw; bestPitch = pitch; }
      }
    }
    state.yaw = bestYaw;
    state.pitch = Math.abs(bestPitch) < 0.12 ? 0.22 : bestPitch;
  }

  function fit() {
    var p = P(), pad = 54;
    rotateAll();
    var xs = _rot.x, ys = _rot.y;
    var x0 = Math.min.apply(null, xs), x1 = Math.max.apply(null, xs);
    var y0 = Math.min.apply(null, ys), y1 = Math.max.apply(null, ys);
    var sx = (W - 2 * pad) / Math.max(1e-6, x1 - x0);
    var sy = (H - 2 * pad) / Math.max(1e-6, y1 - y0);
    state.k = Math.min(sx, sy);
    state.tx = (W - state.k * (x0 + x1)) / 2;
    state.ty = (H + state.k * (y0 + y1)) / 2;
    state.fitted = true;
  }
  function sx(i) { return _rot.x[i] * state.k + state.tx; }
  function sy(i) { return -_rot.y[i] * state.k + state.ty; }
  function depth(i) { return _rot.d[i]; }
  function depthScale(i) {
    if (!is3D()) return 1;
    var lo = Infinity, hi = -Infinity;
    for (var k = 0; k < _rot.d.length; k++) {
      if (_rot.d[k] < lo) lo = _rot.d[k];
      if (_rot.d[k] > hi) hi = _rot.d[k];
    }
    var t = hi > lo ? (_rot.d[i] - lo) / (hi - lo) : 0.5;
    return 0.72 + 0.46 * t;           // nearer = larger
  }
  function radius(i) {
    var base = state.sizeByPotency ? 4.2 + 7.5 * Math.min(1, M().total[i] / 22) : 6;
    if (D.molecules[i].isQuery) base *= 1.7;
    return base * depthScale(i);
  }

  // ---- drawing ----
  function draw() {
    if (!W || !H) resize();
    if (!state.fitted) fit(); else rotateAll();
    var p = P();
    ctx.clearRect(0, 0, W, H);

    var css = getComputedStyle(document.documentElement);
    var line = css.getPropertyValue("--line").trim();
    var fg = css.getPropertyValue("--fg").trim();
    var muted = css.getPropertyValue("--muted").trim();
    var accent = css.getPropertyValue("--accent").trim();
    var surface = css.getPropertyValue("--surface").trim();

    // true-neighbour links
    if (state.links) {
      ctx.strokeStyle = line; ctx.lineWidth = 1;
      ctx.globalAlpha = is3D() ? 0.55 : 0.9;
      ctx.beginPath();
      for (var e = 0; e < M().edges.length; e++) {
        var i = M().edges[e][0], j = M().edges[e][1];
        if (!visible(i) || !visible(j)) continue;
        ctx.moveTo(sx(i), sy(i)); ctx.lineTo(sx(j), sy(j));
      }
      ctx.stroke(); ctx.globalAlpha = 1;
    }

    // highlight links from the selected point
    if (state.sel !== null) {
      ctx.strokeStyle = accent; ctx.lineWidth = 1.6;
      ctx.beginPath();
      for (var e2 = 0; e2 < M().edges.length; e2++) {
        var i2 = M().edges[e2][0], j2 = M().edges[e2][1];
        if (i2 !== state.sel && j2 !== state.sel) continue;
        if (!visible(i2) || !visible(j2)) continue;
        ctx.moveTo(sx(i2), sy(i2)); ctx.lineTo(sx(j2), sy(j2));
      }
      ctx.stroke();
    }

    // points
    var order = [];
    for (var n = 0; n < N; n++) if (visible(n)) order.push(n);
    if (is3D()) order.sort(function (a1, b1) { return depth(a1) - depth(b1); });
    for (var o = 0; o < order.length; o++) {
      var idx = order[o], r = radius(idx);
      var rel = p.reliability[idx];
      var hit = matches(idx);
      var isSel = idx === state.sel, isPin = idx === state.pin;
      ctx.beginPath();
      if (D.molecules[idx].isQuery) {
        // A blend being tried out: a star, so it cannot be mistaken for
        // either a material or an oil. Its position is a noisy-OR of its
        // ingredients' receptor vectors, which is the same assumption the
        // oils are placed under and no stronger.
        var qx = sx(idx), qy = sy(idx), qr = r;
        for (var sp = 0; sp < 10; sp++) {
          var ang = -Math.PI / 2 + sp * Math.PI / 5;
          var rad = (sp % 2 === 0) ? qr : qr * 0.45;
          var px = qx + Math.cos(ang) * rad, py = qy + Math.sin(ang) * rad;
          if (sp === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.closePath();
      } else if (D.molecules[idx].isNatural) {
        // Essential oils are not molecules: they are mixtures built from a
        // published GC composition, so they get a diamond rather than a disc.
        // Their position is a combination of their constituents' vectors, not
        // a measurement of the oil.
        var ox = sx(idx), oy = sy(idx), orr = r * 1.45;
        ctx.moveTo(ox, oy - orr);
        ctx.lineTo(ox + orr, oy);
        ctx.lineTo(ox, oy + orr);
        ctx.lineTo(ox - orr, oy);
        ctx.closePath();
      } else {
        ctx.arc(sx(idx), sy(idx), r, 0, 6.2832);
      }
      ctx.fillStyle = groupColour(primary(idx));
      ctx.globalAlpha = (state.query && !hit && !D.molecules[idx].isQuery)
        ? 0.18 : 0.92;
      ctx.fill();
      ctx.globalAlpha = 1;
      if (isSel || isPin) { ctx.strokeStyle = accent; ctx.lineWidth = 3; }
      else if (hit) { ctx.strokeStyle = fg; ctx.lineWidth = 2; }
      else if (rel < 0.25) { ctx.strokeStyle = muted; ctx.lineWidth = 1; ctx.setLineDash([2, 2]); }
      else { ctx.strokeStyle = surface; ctx.lineWidth = 1; }
      ctx.stroke(); ctx.setLineDash([]);
    }

    // labels, skipping ones that would overlap
    if (state.labels) {
      ctx.font = '500 11px "Archivo", system-ui, sans-serif';
      ctx.textAlign = "center"; ctx.textBaseline = "bottom";
      var boxes = [];
      var prio = order.slice().sort(function (p1, p2) {
        var s1 = (p1 === state.sel || p1 === state.pin) ? 2 : matches(p1) ? 1 : 0;
        var s2 = (p2 === state.sel || p2 === state.pin) ? 2 : matches(p2) ? 1 : 0;
        if (s1 !== s2) return s2 - s1;
        return M().total[p2] - M().total[p1];
      });
      var frontCut = 0;
      if (is3D()) {
        var ds = order.map(depth).sort(function (a1, b1) { return a1 - b1; });
        frontCut = ds[Math.max(0, Math.floor(ds.length * 0.55))];
      }
      for (var q = 0; q < prio.length; q++) {
        var id2 = prio[q];
        if (is3D() && depth(id2) < frontCut
            && id2 !== state.sel && id2 !== state.pin && !matches(id2)) continue;
        if (state.query && !matches(id2) && id2 !== state.sel && id2 !== state.pin) continue;
        var nm = D.molecules[id2].name;
        if (nm.length > 30) nm = nm.slice(0, 29) + "…";
        var w = ctx.measureText(nm).width;
        var cx = sx(id2), cy = sy(id2) - radius(id2) - 3;
        var bx = cx - w / 2 - 2, by = cy - 12, bw = w + 4, bh = 13;
        if (bx < -40 || bx > W + 40 || by < -20 || by > H + 20) continue;
        var clash = false;
        for (var z = 0; z < boxes.length; z++) {
          var o2 = boxes[z];
          if (bx < o2[0] + o2[2] && bx + bw > o2[0] && by < o2[1] + o2[3] && by + bh > o2[1]) { clash = true; break; }
        }
        if (clash) continue;
        boxes.push([bx, by, bw, bh]);
        ctx.fillStyle = surface; ctx.globalAlpha = 0.78;
        ctx.fillRect(bx, by, bw, bh);
        ctx.globalAlpha = 1;
        ctx.fillStyle = (id2 === state.sel || id2 === state.pin) ? accent : fg;
        ctx.fillText(nm, cx, cy);
      }
    }

    // The blends are labelled whether or not labels are on: an unlabelled
    // star in a cloud of 300 points answers nothing.
    for (var qi = 0; qi < order.length; qi++) {
      var qid = order[qi];
      if (!D.molecules[qid].isQuery) continue;
      ctx.font = '700 12px "Archivo", system-ui, sans-serif';
      ctx.textAlign = "center"; ctx.textBaseline = "bottom";
      var qnm = D.molecules[qid].name;
      var qw = ctx.measureText(qnm).width;
      var qcx = sx(qid), qcy = sy(qid) - radius(qid) - 4;
      ctx.fillStyle = surface; ctx.globalAlpha = 0.85;
      ctx.fillRect(qcx - qw / 2 - 3, qcy - 13, qw + 6, 15);
      ctx.globalAlpha = 1;
      ctx.fillStyle = accent;
      ctx.fillText(qnm, qcx, qcy);
    }

    var hiddenCount = groupList().filter(function (c) { return state.hidden[c]; }).length;
    readout.textContent = order.length + "/" + N + " shown"
      + (hiddenCount ? " · " + hiddenCount + " class(es) hidden" : "")
      + (is3D() ? " · drag to rotate, shift-drag to pan" : " · drag to pan");
  }

  function pick(mx, my) {
    var best = null, bestDepth = -Infinity, bd = 1e9;
    for (var i = 0; i < N; i++) {
      if (!visible(i)) continue;
      var dx = mx - sx(i), dy = my - sy(i);
      var d2 = dx * dx + dy * dy, rr = radius(i) + 5;
      if (d2 >= rr * rr) continue;
      if (is3D()) {
        if (depth(i) > bestDepth) { bestDepth = depth(i); best = i; }
      } else if (d2 < bd) { bd = d2; best = i; }
    }
    return best;
  }

  // ---- interaction ----
  var dragging = false, moved = false, lx = 0, ly = 0;
  // Every live pointer, so a second finger becomes a pinch instead of a
  // second simultaneous drag. The canvas sets touch-action:none, so the
  // browser hands the gesture over rather than zooming the page -- which is
  // what we want, since zooming the page would scale the bitmap instead of
  // redrawing the plot at the new scale.
  var pointers = new Map();
  var pinch = null;
  var lastTap = 0;

  function pinchState() {
    var a = [];
    pointers.forEach(function (v) { a.push(v); });
    var dx = a[0].x - a[1].x, dy = a[0].y - a[1].y;
    return {
      dist: Math.max(1e-6, Math.sqrt(dx * dx + dy * dy)),
      mx: (a[0].x + a[1].x) / 2,
      my: (a[0].y + a[1].y) / 2
    };
  }

  cv.addEventListener("pointerdown", function (ev) {
    pointers.set(ev.pointerId, { x: ev.offsetX, y: ev.offsetY });
    if (pointers.size === 1) {
      dragging = true; moved = false; lx = ev.offsetX; ly = ev.offsetY;
      cv.classList.add("drag");
      try { cv.setPointerCapture(ev.pointerId); } catch (e) { /* ignore */ }
    } else if (pointers.size === 2) {
      // A pinch is starting, so whatever the first finger was doing stops
      // here rather than rotating the view while the other hand zooms.
      dragging = false; moved = true; pinch = pinchState();
      tip.hidden = true; cv.classList.remove("drag");
    }
  });
  cv.addEventListener("pointermove", function (ev) {
    if (pointers.has(ev.pointerId)) {
      pointers.set(ev.pointerId, { x: ev.offsetX, y: ev.offsetY });
    }
    if (pointers.size >= 2) {
      if (!pinch) { pinch = pinchState(); return; }
      var now = pinchState();
      var f = now.dist / pinch.dist;
      // Map the old midpoint onto the new one while scaling about it, so the
      // gesture pans and zooms in one step and the point under the fingers
      // stays under the fingers.
      state.tx = now.mx + (state.tx - pinch.mx) * f;
      state.ty = now.my + (state.ty - pinch.my) * f;
      state.k *= f;
      pinch = now;
      tip.hidden = true;
      draw();
      return;
    }
    var mx = ev.offsetX, my = ev.offsetY;
    if (dragging) {
      var dx = mx - lx, dy = my - ly;
      if (Math.abs(dx) + Math.abs(dy) > 2) moved = true;
      if (is3D() && !ev.shiftKey) {
        state.yaw += dx * 0.009;
        state.pitch = Math.max(-1.45, Math.min(1.45, state.pitch + dy * 0.009));
      } else {
        state.tx += dx; state.ty += dy;
      }
      lx = mx; ly = my;
      tip.hidden = true;
      draw();
      return;
    }
    // No hover on a touch screen: a finger that is not down is not pointing
    // at anything, and a tooltip pinned under the thumb covers the point it
    // describes. Tapping selects, and the inspector is the readout.
    if (ev.pointerType === "touch") return;
    var h = pick(mx, my);
    if (h !== state.hover) { state.hover = h; }
    if (h === null) { tip.hidden = true; return; }
    var m = D.molecules[h];
    tip.innerHTML = '<div class="t-name">' + esc(m.name) + '</div>'
      + '<div class="t-meta">' + esc(m.cls.replace(/_/g, " ")) + " · " + esc(m.formula)
      + " · Σ " + M().total[h].toFixed(1) + "</div>";
    tip.hidden = false;
    var tw = tip.offsetWidth, th = tip.offsetHeight;
    tip.style.left = Math.min(Math.max(6, mx + 14), W - tw - 6) + "px";
    tip.style.top = Math.min(Math.max(6, my - th - 12), H - th - 6) + "px";
  });
  cv.addEventListener("pointercancel", function (ev) {
    pointers.delete(ev.pointerId);
    if (pointers.size < 2) pinch = null;
    if (pointers.size === 0) { dragging = false; cv.classList.remove("drag"); }
  });
  cv.addEventListener("pointerup", function (ev) {
    var wasPinch = pointers.size >= 2;
    pointers.delete(ev.pointerId);
    if (pointers.size < 2) pinch = null;
    // Lifting one finger out of a pinch leaves the other down. Treat that as
    // the end of the gesture rather than the start of a drag, or the view
    // lurches as the remaining finger comes off.
    if (wasPinch) { dragging = false; cv.classList.remove("drag"); return; }
    dragging = false; cv.classList.remove("drag");
    if (moved) return;
    // Double-tap re-fits, the touch equivalent of the double-click below.
    if (ev.pointerType === "touch") {
      var t = Date.now();
      if (t - lastTap < 320) {
        lastTap = 0;
        state.fitted = false; chooseView(); draw();
        return;
      }
      lastTap = t;
    }
    var h = pick(ev.offsetX, ev.offsetY);
    if (h === null) { state.sel = null; state.pin = null; clearPin.hidden = true; }
    else if (ev.shiftKey && state.sel !== null && h !== state.sel) {
      state.pin = state.sel; state.sel = h; clearPin.hidden = false;
    } else { state.sel = h; }
    renderDetail(); draw();
  });
  // The Reset control is gone, so double-clicking the plot re-fits the view.
  cv.addEventListener("dblclick", function () {
    state.fitted = false; chooseView(); draw();
  });
  cv.addEventListener("pointerleave", function (ev) {
    tip.hidden = true;
    pointers.delete(ev.pointerId);
    if (pointers.size < 2) pinch = null;
    if (pointers.size === 0) { dragging = false; cv.classList.remove("drag"); }
  });
  cv.addEventListener("wheel", function (ev) {
    ev.preventDefault();
    var f = Math.exp(-ev.deltaY * 0.0014);
    var mx = ev.offsetX, my = ev.offsetY;
    state.tx = mx - (mx - state.tx) * f;
    state.ty = my - (my - state.ty) * f;
    state.k *= f;
    tip.hidden = true;
    draw();
  }, { passive: false });

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  // ---- inspector ----
  function topReceptors(i, n) {
    var row = M().scores[i], out = [];
    for (var r = 0; r < row.length; r++) out.push([r, row[r]]);
    out.sort(function (a2, b2) { return b2[1] - a2[1]; });
    return out.slice(0, n);
  }
  function neighbours(i, n) {
    var out = [];
    for (var j = 0; j < N; j++) if (j !== i) out.push([j, M().dist[i][j]]);
    out.sort(function (a2, b2) { return a2[1] - b2[1]; });
    return out.slice(0, n);
  }

  // Typing a descriptor name ranks the library on that one quality. This
  // answers a question whole-vector similarity cannot: a material has several
  // odour facets, and two that share one strongly can still sit far apart
  // because the other hundred-odd dimensions dominate the cosine. No new
  // control for it -- the search box already matches descriptor names.
  function descriptorQuery() {
    var q = (state.query || "").trim();
    if (q.length < 3 || !D.perceptAllNames) return null;
    var names = D.perceptAllNames;
    var exact = names.indexOf(q);
    if (exact >= 0) return {name: names[exact], col: exact};
    var hits = [];
    for (var i = 0; i < names.length; i++) {
      if (names[i].indexOf(q) === 0) hits.push(i);
    }
    return hits.length === 1 ? {name: names[hits[0]], col: hits[0]} : null;
  }

  function rankingHtml() {
    var dq = descriptorQuery();
    if (!dq) return "";
    var rows = [];
    for (var i = 0; i < D.molecules.length; i++) {
      var r = D.molecules[i].perceptAll;
      if (r && r.length > dq.col) rows.push([i, r[dq.col]]);
    }
    if (!rows.length) return "";
    rows.sort(function (a, b) { return b[1] - a[1]; });
    var html = '<h2>Strongest on &ldquo;' + esc(dq.name) + '&rdquo;</h2>'
      + '<div class="bars">';
    for (var k = 0; k < Math.min(3, rows.length); k++) {
      var i2 = rows[k][0], v = rows[k][1];
      html += '<div class="rrow"><span class="g" style="text-align:left">'
        + '<button type="button" data-go="' + i2 + '" '
        + 'style="background:none;border:0;padding:0;color:inherit;'
        + 'font:inherit;cursor:pointer;text-align:left">'
        + esc(D.molecules[i2].name)
        + (D.molecules[i2].inTrain ? '<sup title="this material is in the '
            + 'training set of the model, so its score is partly recall of a human '
            + 'label">t</sup>' : "")
        + "</button></span>"
        + '<span class="track"><span class="fill" style="width:'
        + (Math.max(0, Math.min(1, v)) * 100).toFixed(1) + '%"></span></span>'
        + '<span class="v">' + v.toFixed(3) + "</span></div>";
    }
    html += "</div>";
    var nt = 0;
    for (var z = 0; z < Math.min(3, rows.length); z++) {
      if (D.molecules[rows[z][0]].inTrain) nt++;
    }
    html += '<p class="note">Top 3 of ' + D.molecules.length
      + " materials, ranked on this descriptor alone. Predicted, not measured"
      + (nt ? "; " + nt + " of the 3 marked <sup>t</sup> are in the model's "
          + "training set, so their score is partly recall of a human label "
          + "rather than a prediction" : "")
      + ".</p>";
    return html;
  }

  function renderDetail() {
    var el = document.getElementById("detail");
    var rank = rankingHtml();
    if (state.sel === null) {
      el.innerHTML = rank
        || ('<h2>Inspector</h2><p class="empty">Click a point to inspect it. '
            + 'Shift-click a second point to compare two materials. '
            + 'Type an odour descriptor in the search box to rank the library '
            + 'on it.</p>');
      bindGo(el);
      return;
    }
    var i = state.sel, m = D.molecules[i], p = P();
    var html = '<h2>Inspector</h2>';
    // The first chip used to show the chemical class, but no material has one:
    // expanded_materials.csv carries no class column, so every value was the
    // empty string and the chip rendered as a blank coloured pill. The
    // perfumer's own odour family is shown instead, where the inventory has
    // one. The note-family chips are coloured from the note palette rather
    // than through groupColour, which colours by whatever scheme is active and
    // so greyed them out whenever the predicted-descriptor scheme was selected.
    var chips = "";
    if (m.isQuery) {
      chips += '<span class="chip" style="background:var(--warn,#c9803a);'
        + 'color:#fff">BLEND</span> ';
    }
    if (m.isNatural) {
      chips += '<span class="chip" style="background:var(--accent);'
        + 'color:#fff">EO</span> ';
    }
    if (m.family) {
      chips += '<span class="chip" style="background:var(--surface-2);'
        + 'color:var(--fg)">' + esc(m.family) + "</span>";
    }
    if (m.volatility) {
      chips += ' <span class="chip" style="background:var(--surface-2);'
        + 'color:var(--muted)">' + esc(m.volatility) + "</span>";
    }
    (m.odour || []).forEach(function (t) {
      var c = (D.odourColour && D.odourColour[t]) || "#9aa6b1";
      chips += ' <span class="chip" style="background:' + c + '">'
        + esc(t.toLowerCase()) + "</span>";
    });
    html += '<p style="margin:0 0 7px;display:flex;gap:4px;flex-wrap:wrap">' + chips + "</p>";
    html += '<p style="margin:0 0 9px;font-family:var(--font-display);font-size:17px;font-weight:700">'
      + esc(m.name) + "</p>";
    html += '<dl class="kv">'
      + (m.isQuery || m.isNatural
          ? "<dt>Built from</dt><dd>" + esc(m.formula) + "</dd>"
          : "<dt>Formula</dt><dd>" + esc(m.formula) + "</dd>"
            + "<dt>SMILES</dt><dd>" + esc(m.smiles) + "</dd>"
            + "<dt>Heavy atoms</dt><dd>" + m.atoms + "</dd>")
      + "<dt>Total activation</dt><dd>" + M().total[i].toFixed(2) + "</dd>"
      + ((m.perceptTop && m.perceptTop.length)
         ? "<dt>Predicted odour" + (m.inTrain ? " <sup>t</sup>" : "")
           + "</dt><dd style=\"font-family:var(--font-body);font-size:12px\">"
           + m.perceptTop.map(function (t) {
               return '<button type="button" data-desc="' + esc(t[0]) + '" '
                 + 'style="background:none;border:0;padding:0;color:inherit;'
                 + 'font:inherit;cursor:pointer;text-decoration:underline;'
                 + 'text-decoration-style:dotted;text-underline-offset:2px">'
                 + esc(t[0]) + " " + t[1].toFixed(2) + "</button>";
             }).join(", ")
           + "</dd>" : "")
      + "<dt>Placement</dt><dd>" + p.reliability[i].toFixed(2)
      + (p.reliability[i] < 0.25 ? " — unreliable" : "") + "</dd></dl>";
    // An oil built from a composition one constituent dominates lands on that
    // constituent, so the diamond would otherwise imply an oil the model can
    // tell apart from it. Sweet orange and tangerine both sit exactly on
    // D-Limonene, because what separates them is a material the library has
    // no entry for.
    if (m.isQuery) {
      var ing = (m.queryIngredients || []).map(function (q) {
        return esc(q.name) + " " + q.pct.toFixed(1) + "%"
          + (q.oil ? " (EO)" : "");
      }).join(", ");
      var place = m.queryPlacement || "union";
      var how = (place === "union")
        ? "a noisy-OR of its ingredients' receptor vectors: a receptor fires"
          + " if any ingredient fires it. That is a union, not an average, so"
          + " a blend of many ingredients is pushed to the rim of the cloud"
          + " however ordinary it smells — the distance measures ingredient"
          + " count as much as character."
        : (place === "mean")
        ? "a weighted mean of its ingredients' receptor probabilities, which"
          + " lands on a flat vector no single molecule resembles."
        : "a weighted mean of its ingredients' receptor logits — an average"
          + " taken in the same space this picture is reduced from, so the"
          + " blend sits among the materials rather than outside them.";
      html += '<p class="t-meta">This is a formula, not a material. It is'
        + " placed by " + how + "</p>";
      if (ing) {
        html += '<p class="t-meta"><strong>Ingredients read</strong> ('
          + ((m.queryCoverage || 0) * 100).toFixed(0) + "% of the neat weight): "
          + ing + "</p>";
      }
      if ((m.queryDropped || []).length) {
        html += '<p class="t-meta" style="color:var(--warn,#c9803a)">'
          + "<strong>Dropped</strong>, so nothing here accounts for them: "
          + m.queryDropped.map(esc).join(", ") + "</p>";
      }
    }
    if (m.isNatural && m.collapsedOnto) {
      html += '<p class="t-meta" style="color:var(--warn,#c9803a)">'
        + "Not a distinguishable oil: this build sits on top of "
        + esc(m.collapsedOnto)
        + ", so its position says nothing the constituent does not.</p>";
    }

    // Potency. Detection threshold leads because it is what dosing turns on
    // and because 28 of these values are measured rather than modelled.
    // Perceived intensity follows as a secondary, weaker line: it is strength
    // at one fixed dilution, which is a different variable -- linalool reads
    // mid-range there and near the bottom by threshold, and the bench agrees
    // with the threshold. Neither is encoded in the point size; an earlier
    // build did that and it read as importance.
    // Dosing. Only two numbers earn a place here. A measured threshold, where
    // one exists, and the perfumer's own maximum use level, which tracks those
    // measured values at rho 0.76. Model-predicted thresholds are deliberately
    // absent: they reached rho 0.14 against the same use levels in-domain and
    // -0.17 outside it, so they carried no information and sometimes pointed
    // the wrong way, despite scoring 0.82 in cross-validation on the training
    // set's own chemical space.
    if ((m.odt !== null && m.odt !== undefined)
        || (m.topPct !== null && m.topPct !== undefined)) {
      html += '<h2 style="margin-top:14px">Dosing</h2>';
      if (m.odt !== null && m.odt !== undefined) {
        html += '<div class="bars"><div class="rrow">'
          + '<span class="g">log(1/ODT)</span>'
          + '<span class="track"><span class="fill" style="width:'
          + Math.max(0, Math.min(100, m.odtPct)).toFixed(1) + '%"></span></span>'
          + '<span class="v">' + m.odt.toFixed(2) + "</span></div></div>"
          + '<p class="note"><strong>Measured</strong> detection threshold '
          + "(Abraham 2012), " + m.odtPct.toFixed(0)
          + "th percentile of the materials that have one. Higher means a lower "
          + "threshold, so a more potent material.</p>";
      }
      if (m.topPct !== null && m.topPct !== undefined) {
        html += '<dl class="kv"><dt>Max use level</dt><dd>'
          + m.topPct + "%</dd>"
          + (m.volatility ? "<dt>Volatility</dt><dd>" + esc(m.volatility)
             + "</dd>" : "")
          + (m.family ? "<dt>Family</dt><dd>" + esc(m.family) + "</dd>" : "")
          + "</dl>"
          + '<p class="note">Use level is the perfumer\'s own working ceiling, '
          + "which also reflects IFRA limits, cost and how much of the character "
          + "is wanted &mdash; not potency alone.</p>";
      }
      if (m.odt === null || m.odt === undefined) {
        html += '<p class="note">No measured threshold for this material. '
          + "A predicted one is not shown: those predictions did not track "
          + "practice on this library.</p>";
      }
    }

    if (p.reliability[i] < 0.25) {
      html += '<p class="warnbox">This point sits badly on the plane: its plotted '
        + "neighbours are mostly not its real ones. Trust the list below, not the position.</p>";
    }

    if (state.pin !== null && state.pin !== i) {
      var j = state.pin, d = M().dist[i][j];
      html += '<h2 style="margin-top:14px">Compared with ' + esc(D.molecules[j].name) + "</h2>";
      html += '<dl class="kv"><dt>Distance</dt><dd>' + d.toFixed(2)
        + "</dd><dt>Percentile</dt><dd>" + pct(d).toFixed(1)
        + "th of all pairs</dd><dt>Library median</dt><dd>" + M().medianDistance + "</dd></dl>";
      var diffs = [];
      for (var r2 = 0; r2 < D.receptors.length; r2++) {
        diffs.push([r2, M().scores[i][r2] - M().scores[j][r2]]);
      }
      diffs.sort(function (a2, b2) { return Math.abs(b2[1]) - Math.abs(a2[1]); });
      html += '<p class="note" style="margin:8px 0 5px">Receptors that separate them</p><div class="bars">';
      for (var q2 = 0; q2 < 6; q2++) {
        var rr = diffs[q2];
        var sign = rr[1] > 0 ? esc(m.name) : esc(D.molecules[j].name);
        html += '<div class="rrow"><span class="g">' + esc(D.receptors[rr[0]].gene) + "</span>"
          + '<span class="v" style="text-align:left;color:var(--muted)">' + sign.slice(0, 20) + "</span>"
          + '<span class="v">' + (rr[1] >= 0 ? "+" : "") + rr[1].toFixed(2) + "</span></div>";
      }
      html += "</div>";
    }

    // Neighbours first: they are what the map is read for, and the per-receptor
    // profile is reference material underneath it.
    html += '<h2 style="margin-top:14px">Nearest in receptor space</h2><ul class="nn">';
    neighbours(i, 8).forEach(function (t) {
      html += '<li><button type="button" data-go="' + t[0] + '">' + esc(D.molecules[t[0]].name)
        + '</button><span class="d">' + t[1].toFixed(1) + "</span></li>";
    });
    html += "</ul>";

    html += '<h2 style="margin-top:14px">Receptor profile</h2><div class="bars">';
    topReceptors(i, 12).forEach(function (t) {
      html += '<div class="rrow"><span class="g">' + esc(D.receptors[t[0]].gene) + "</span>"
        + '<span class="track"><span class="fill" style="width:' + (t[1] * 100).toFixed(1) + '%"></span></span>'
        + '<span class="v">' + t[1].toFixed(3) + "</span></div>";
    });
    html += "</div>";
    html += '<p class="note">Scores are sigmoid outputs: P(receptor responds), not intensity.</p>';

    el.innerHTML = rank ? rank + html : html;
    bindGo(el);
  }

  function bindGo(el) {
    Array.prototype.forEach.call(el.querySelectorAll("[data-go]"), function (b) {
      b.addEventListener("click", function () {
        state.sel = parseInt(b.getAttribute("data-go"), 10);
        renderDetail(); draw();
      });
    });
    // A descriptor in the inspector ranks the library on itself. The search box
    // is updated too, so the control and the view never disagree about what is
    // being asked.
    Array.prototype.forEach.call(el.querySelectorAll("[data-desc]"), function (b) {
      b.addEventListener("click", function () {
        var d = b.getAttribute("data-desc");
        var box = document.getElementById("q");
        if (box) box.value = d;
        state.query = d.toLowerCase();
        renderDetail(); draw();
      });
    });
  }

  function renderFoot() {
    var p = P();
    var pm = (D.meta && D.meta.percept_model) || {};
    // Two different models are on screen at once and conflating them is the
    // easy mistake: the layout is receptor space, the colours are predicted
    // smell. Say so, and quote each model's own numbers.
    var colourNote = pm.name
      ? "then coloured by <strong>" + (pm.n_descriptors || "") + " predicted odour "
        + "descriptors</strong> from a separate model trained on the human-labelled "
        + "GS-LF set"
        + (pm.auc ? " (out-of-fold AUC " + pm.auc.toFixed(3) : "")
        + (pm.auc && pm.similarity
            ? ", label-grounded similarity &rho; " + (pm.similarity > 0 ? "+" : "")
              + pm.similarity.toFixed(3) + ")"
            : pm.auc ? ")" : "")
        + ". "
      : "";
    // Which encoder produced the layout comes from the payload: the same page
    // is built from more than one, and naming one in prose got it wrong.
    var encoder = (D.models && D.models[state.model]
                   && D.models[state.model].label) || "";
    document.getElementById("sub").innerHTML =
      D.meta.n_molecules + " perfumery materials scored against " + D.meta.n_receptors
      + " functional human olfactory receptors by <strong>MolOR</strong> "
      + "(" + esc(encoder) + ", ESM-2 650M protein embeddings). <strong>Position is "
      + "receptor response, not smell</strong> &mdash; " + colourNote
      + "Drag to rotate, shift-drag to pan, "
      + "scroll to zoom; on a touch screen drag to rotate, pinch to zoom and "
      + "double-tap to re-fit. Click or tap a material to inspect it; "
      + "shift-click a second to compare. "
      + "<br><br>"
      + "Grey links join pairs that are mutual nearest neighbours in the real "
      + "386-dimensional space, so <strong>trust the links over bare proximity</strong> — "
      + "a dotted outline marks a material whose plotted neighbours are mostly not its true "
      + "ones. This projection reproduces the real distances at Shepard "
      + p.shepard.toFixed(3) + ". Two limits: enantiomers and E/Z isomers land on the "
      + "same point, so stereochemistry is effectively invisible; and the vectors encode "
      + "chemical structure more strongly than smell.";
    document.getElementById("foot").innerHTML =
      "<strong>Layout</strong>: MolOR " + esc(encoder) + ", cross-attention over "
      + "ESM-2 650M receptor embeddings, checkpoint "
      + esc(D.meta.checkpoint_md5.slice(0, 12))
      + ", receptor panel " + esc(D.meta.panel_hash)
      + " (" + D.meta.n_receptors + " functional receptors from HORDE, pseudogenes "
      + "and fragments excluded). Weights from Zenodo record 13765978, code from "
      + "microsoft/olfaction."
      + "<br><strong>Colours</strong>: " + esc(pm.name || "none")
      + (pm.n_descriptors ? ", " + pm.n_descriptors + " descriptors" : "")
      + ", trained on GoodScents + Leffingwell (4983 molecules). "
      + "Selected by ablation to keep similarity structure that per-label accuracy "
      + "tuning destroys."
      + ((D.meta && D.meta.threshold_model && D.meta.threshold_model.n_measured)
          ? "<br><strong>Dosing</strong>: measured odour detection thresholds "
            + "from Abraham 2012 for "
            + D.meta.threshold_model.n_measured
            + " materials, and the perfumer's own maximum use levels. "
            + "Predicted thresholds are withheld: a model scoring r 0.82 in "
            + "cross-validation on Abraham's chemical space reached only "
            + "Spearman 0.14 against those use levels on this library, and "
            + "-0.17 for materials outside its training range, so it carried "
            + "no usable information here."
          : "")
      // The two encoders fail differently, and the MPNN's failure is the more
      // serious one, so the caveat has to follow whichever built this page.
      + "<br><strong>Read it with care</strong>: predicted descriptors are not "
      + "measured ones; chirality is invisible to both models and E/Z isomers "
      + "coincide too, "
      + (/MPNN/i.test(encoder)
          ? "because although bond stereo reaches this encoder it is destroyed "
            + "inside it &mdash; roughly half its output dimensions saturate, so "
            + "the layout rests on a partly degenerate representation"
          : "because this encoder consumes no bond features at all")
      + "; and a blind test of the suggestion ranking did not reproduce the "
      + "perfumer's own ordering. Useful as a search heuristic over the library, "
      + "not as a prediction of smell.";
  }

  window.addEventListener("resize", function () {
    resize(); state.fitted = false; chooseView(); draw();
  });
  if (window.matchMedia) {
    var mq = window.matchMedia("(prefers-color-scheme: dark)");
    if (mq.addEventListener) mq.addEventListener("change", draw);
  }
  // A layout picker, shown only when the payload carries more than one
  // encoder. The two receptor spaces agree with each other at Spearman 0.255,
  // so which one is on screen changes what sits next to what, and no measure
  // has settled which is better -- the comparison is the point.
  (function () {
    var field = document.getElementById("modelField");
    var sel = document.getElementById("model");
    if (!field || !sel || !D.modelOrder || D.modelOrder.length < 2) return;
    D.modelOrder.forEach(function (k) {
      var o = document.createElement("option");
      o.value = k;
      o.textContent = (D.models[k] && D.models[k].label) || k;
      sel.appendChild(o);
    });
    sel.value = state.model;
    field.hidden = false;
    sel.addEventListener("change", function () {
      state.model = sel.value;
      // Projections are per model, so the chosen one has to be re-resolved.
      var keys = Object.keys(D.models[state.model].projections);
      if (keys.indexOf(state.proj) < 0) {
        var three = keys.filter(function (k) {
          return Array.isArray(D.models[state.model].projections[k].z);
        });
        state.proj = three.length ? three[0] : keys[0];
      }
      state.fitted = false;
      chooseView(); draw(); renderDetail(); renderFoot();
    });
  }());

  resize(); chooseView(); draw(); renderDetail(); renderFoot();
})();
</script>
