[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orvector"
version = "0.1.0"
description = "SMILES to human olfactory receptor responsiveness vectors"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch==2.3.0",
    "dgl==2.2.1",
    "dgllife==0.3.2",
    "rdkit==2023.3.1",
    "fair-esm==2.0.0",
    "numpy==1.26.4",
    "pandas==2.0.3",
    "scipy==1.11.4",
    "scikit-learn==1.3.2",
    "torchdata==0.9.0",
    "pyyaml",
    "psutil",
    "pydantic",
    "requests",
    "tqdm",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning", "ignore::DeprecationWarning"]
